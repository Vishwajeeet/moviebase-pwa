<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0d0d0d">

  <title>MovieBase — Stats</title>

  <link rel="manifest" href="/manifest.json">

  <link rel="stylesheet" href="/css/main.css">
</head>

<body>

  <div class="app-container">

    <main class="page">
      <div class="brand-bar" id="brand-bar"><span>MediaBase</span></div>

      <!-- HEADER -->

      <header class="page-header">

        <button id="btn-back" class="back-btn">
          ←
        </button>

        <h1 class="page-title">
          Your Stats
        </h1>

        <div style="width:40px"></div>

      </header>

      <div class="type-pills" id="stats-type-pills">
        <button class="type-pill active" data-tab="media" type="button">🎬 Movies & Series</button>
        <button class="type-pill" data-tab="games" type="button">🎮 Games</button>
      </div>

      <!-- FILTERS -->

        <section class="section" style="margin-bottom:20px">

          <select id="year-select" class="input-field" style="margin-bottom:12px"></select>

          <div class="month-scroll" id="month-filter">

            <button class="chip selected" data-month="0">
              Full Year
            </button>

            <button class="chip" data-month="1">Jan</button>
            <button class="chip" data-month="2">Feb</button>
            <button class="chip" data-month="3">Mar</button>
            <button class="chip" data-month="4">Apr</button>
            <button class="chip" data-month="5">May</button>
            <button class="chip" data-month="6">Jun</button>
            <button class="chip" data-month="7">Jul</button>
            <button class="chip" data-month="8">Aug</button>
            <button class="chip" data-month="9">Sep</button>
            <button class="chip" data-month="10">Oct</button>
            <button class="chip" data-month="11">Nov</button>
            <button class="chip" data-month="12">Dec</button>

          </div>

        </section>

        <!-- STATS GRID -->

        <div class="stat-strip">

          <div class="stat-box" id="s-titles">
            <div class="stat-number">—</div>
            <div class="stat-label">
              📀 Titles Watched
            </div>
          </div>

          <div class="stat-box" id="s-hours">
            <div class="stat-number">—</div>
            <div class="stat-label">
              ⏱ Hours Watched
            </div>
          </div>

          <div class="stat-box" id="s-movies">
            <div class="stat-number">—</div>
            <div class="stat-label">
              🎬 Movies
            </div>
          </div>

          <div class="stat-box" id="s-series">
            <div class="stat-number">—</div>
            <div class="stat-label">
              📺 Series Seasons
            </div>
          </div>

          <div class="stat-box stat-full" id="s-genre">
            <div class="stat-number">—</div>

            <div class="stat-label">
              Top Genre
            </div>
          </div>

          <div class="stat-box" id="s-rating">
            <div class="stat-number">—</div>

            <div class="stat-label">
              Avg Rating
            </div>
          </div>

          <div class="stat-box" id="s-month">
            <div class="stat-number">—</div>

            <div class="stat-label">
              Most Active Month
            </div>
          </div>

          <div class="stat-box stat-full" id="s-longest">
            <div class="stat-number">—</div>

            <div class="stat-label">
              Longest Watch
            </div>
          </div>

          <div class="stat-box" id="s-best-month">
            <div class="stat-number">—</div>

            <div class="stat-label">
              Best Month (Avg)
            </div>
          </div>

          <div class="stat-box" id="s-total-titles">
            <div class="stat-number">—</div>

            <div class="stat-label">
              Total This Year
            </div>
          </div>

          <div class="stat-box" id="s-completion-rate">
            <div class="stat-number">—</div>

            <div class="stat-label">
              Completion Rate
            </div>
          </div>

        </div>
        <!-- PLAYTIME LEADERBOARD -->

        <p class="section-title" style="margin-top:28px">
          🏆 Playtime Leaderboard
        </p>

        <div id="playtime-leaderboard"></div>

        <!-- TOP PICKS -->

        <p class="section-title" style="margin-top:28px">
          Your 🤩 Picks
        </p>

        <div id="top-picks" class="grid-2"></div>

        <!-- FUN FACTS -->

        <p class="section-title" style="margin-top:28px">
          Fun Facts
        </p>

        <div id="fun-facts"></div>

        <!-- DEEP CUTS -->

        <p class="section-title" style="margin-top:28px">
          Deep Cuts
        </p>

        <div id="deep-cuts"></div>

        <!-- WRAPPED CARD -->

        <p class="section-title" style="margin-top:28px">
          Wrapped Card
        </p>

        <button class="btn btn-primary" id="btn-generate" style="margin-bottom:16px">
          ✨ Generate Wrapped Card
        </button>

        <p id="wrapped-card-message" class="text-muted" style="
          margin-bottom:16px;
          display:none
        "></p>

        <div id="canvas-wrap" style="
          margin-bottom:12px;
          display:none
        "></div>

        <button class="btn btn-ghost" id="btn-download" style="display:none">
          ⬇ Download Card
        </button>

    </main>

  </div>

  <div id="toast" class="toast"></div>

  <!-- Firebase CDN -->

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Shared scripts -->

  <script src="/js/config.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/firestore.js"></script>
  <script src="/js/tmdb.js"></script>
  <script src="/js/rawg.js"></script>

  <!-- Page script -->

  <script src="/js/stats.js"></script>

  <!-- PWA -->

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
    <script>
    var brandBar = document.getElementById('brand-bar');
    if (brandBar) brandBar.addEventListener('click', function () {
      window.location.href = '/home.html';
    });
  </script>

</body>

</html>
