<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0d0d0d">

  <title>MovieBase — Playlist</title>

  <link rel="manifest" href="/manifest.json">

  <link rel="stylesheet" href="/css/main.css">
</head>

<body>

  <div class="app-container">

    <main class="page">

      <header class="page-header">

        <button class="back-btn" id="btn-back">
          ←
        </button>

        <h1 class="page-title" id="playlist-title" style="font-size:18px">
          ...
        </h1>

        <span id="entry-count" class="text-sm text-muted"></span>

      </header>

      <p class="text-sm text-muted" style="margin-bottom:16px">
        Tap title to rename
      </p>

      <div class="toggle-pair" id="type-filter" style="margin-bottom:16px;grid-template-columns: 1fr 1fr 1fr 1fr">
        <button class="toggle-btn active" data-filter="all">All</button>
        <button class="toggle-btn" data-filter="movie">🎬</button>
        <button class="toggle-btn" data-filter="series">📺</button>
        <button class="toggle-btn" data-filter="game">🎮</button>
      </div>

      <div id="entries-container"></div>

      <div id="empty-state" class="empty-state" style="display:none">

        <div class="empty-state-icon">
          🎬
        </div>

        <p class="empty-state-text">
          Nothing here yet.
        </p>

        <button class="btn btn-primary" style="max-width:200px;margin:0 auto" id="btn-add-empty">
          Add something
        </button>

      </div>

    </main>

  </div>

    <button class="fab" id="fab-add">
    <span>+</span> Add Entry
  </button>
    

  <div class="modal-overlay" id="rename-modal">

    <div class="modal-box">

      <p class="modal-title">
        Rename Playlist
      </p>

      <input class="input-field" id="rename-input" maxlength="40">

      <div class="modal-actions">

        <button class="btn btn-ghost" id="btn-cancel-rename">
          Cancel
        </button>

        <button class="btn btn-primary" id="btn-confirm-rename">
          Save
        </button>

      </div>

    </div>

  </div>

  <!-- Options Bottom Sheet -->

  <div class="modal-overlay" id="entry-options-modal">

    <div class="modal-box">

      <button class="btn-option" id="btn-edit-entry">
        ✏️ Edit Entry
      </button>

      <button class="btn-option" id="btn-move-entry">
        📂 Move to Playlist
      </button>

      <button class="btn-option" id="btn-share-entry">
        🔗 Share Entry
      </button>

      <button class="btn-option btn-option-danger" id="btn-delete-entry">
        🗑️ Delete Entry
      </button>

    </div>

  </div>

  <!-- Edit Entry Modal -->

  <div class="modal-overlay" id="edit-entry-modal">

    <div class="modal-box">

      <p class="modal-title">
        Edit Entry
      </p>

      <p class="modal-entry-title" id="edit-entry-title"></p>

      <p style="font-size:12px;font-weight:600;color:var(--text-muted);margin:20px 0 12px">
        MONTH WATCHED
      </p>

      <div class="month-scroll" id="edit-month-chips"></div>

      <p style="font-size:12px;font-weight:600;color:var(--text-muted);margin:20px 0 12px">
        RATING
      </p>

      <div class="emoji-row" id="edit-emoji-row"></div>

      <div class="modal-actions">

        <button class="btn btn-ghost" id="btn-cancel-edit">
          Cancel
        </button>

        <button class="btn btn-primary" id="btn-save-edit">
          Save Changes
        </button>

      </div>

    </div>

  </div>

  <!-- Delete Confirm Modal -->

  <div class="modal-overlay" id="delete-confirm-modal">

    <div class="modal-box">

      <p class="modal-title">
        Delete Entry?
      </p>

      <p style="color:var(--text-muted);margin-bottom:24px">
        Are you sure? This cannot be undone.
      </p>

      <div class="modal-actions">

        <button class="btn btn-ghost" id="btn-cancel-delete">
          Cancel
        </button>

        <button class="btn btn-danger" id="btn-confirm-delete">
          Delete
        </button>

      </div>

    </div>

  </div>

  <!-- Move to Playlist Modal -->

  <div class="modal-overlay" id="move-to-modal">

    <div class="modal-box">

      <p class="modal-title">
        Move to...
      </p>

      <div id="playlists-list"></div>

      <div class="modal-actions">

        <button class="btn btn-ghost" id="btn-cancel-move">
          Cancel
        </button>

      </div>

    </div>

  </div>
  <!-- Share Card Modal -->
  <div class="modal-overlay" id="share-modal">
    <div class="modal-box">
      <p class="modal-title">Share Entry</p>
      <div id="share-canvas-wrap" style="margin-bottom:16px;border-radius:12px;overflow:hidden"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="btn-close-share">Close</button>
        <button class="btn btn-primary" id="btn-download-share">⬇ Download</button>
      </div>
    </div>
  </div>

  <!-- Logout Confirm Modal -->
  <div class="modal-overlay" id="logout-modal">
    <div class="modal-box">
      <p class="modal-title">Sign out?</p>
      <p style="color:var(--text-muted);margin-bottom:24px">You'll need to sign in again to access your data.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="btn-cancel-logout">Cancel</button>
        <button class="btn btn-danger" id="btn-confirm-logout">Sign Out</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Shared scripts -->
  <script src="/js/config.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/firestore.js"></script>
  <script src="/js/tmdb.js"></script>
  <script src="/js/rawg.js"></script>

  <!-- Page script -->
  <script src="/js/playlist.js"></script>

  <!-- PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>

</body>

</html>
